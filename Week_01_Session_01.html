d make starting difficult.", "Choose one action you can take for the next class."], "deliverable": "One helpful action and a reason.", "support": "Start: ‘I would leave … because …’.", "stretch": "Explain how your action helps someone you do not know.", "workspace": "notebook", "minutes": 3, "notes": "Accept a clear desk, working mouse, tidy keyboard, available headphones, patient partner. Ask what missing or damaged equipment does to learning. Keep examples hypothetical, not accusations about classmates."}, {"type": "compare", "title": "One web. Many ways to share.", "left": {"title": "An early-style page", "text": "A heading, short paragraphs and text links.", "bullets": ["Mostly words", "Simple layout"]}, "right": {"title": "A modern-style page", "text": "A heading, pictures, menus and useful text.", "bullets": ["More visual clues", "More ways to move around"]}, "prompt": "Which features help a visitor find an answer? More decoration does not always mean a better page.", "minutes": 2, "notes": "These are original schematic examples, not screenshots of the historical first site. Compare clarity, images and navigation. The source p.21 has conflicting invention dates (1995 in a prompt; 1991 in a fact box). CERN records the proposal in 1989, the first website by late 1990 and wider announcement in 1991. Avoid the source's changing website count. Official source: https://home.cern/science/computing/the-birth-of-the-web/short-history-web/ . The focus is design change, not memorising dates."}, {"type": "brief", "title": "Respect keeps learning moving", "text": "Our choices affect the person beside us and the next person who uses the computer.", "bullets": ["Listen when the teacher needs the class's attention.", "Give your partner time to try.", "Use equipment with care.", "Follow the rules of your own school."], "minutes": 2, "notes": "Ask students to explain one benefit, such as hearing an instruction, completing a task or avoiding a spill. Establish the attention routine: stop typing, hands away, turn and listen."}, {"type": "animation", "title": "Watch the respect routine", "animation": "RespectCycle", "text": "Notice the small actions that make group work easier.", "prompts": ["Which action could you do immediately?", "What would happen if nobody took turns?"], "minutes": 1, "notes": "Play the short Manim animation once. Ask students to mime stopping typing and turning to listen. Replay only if useful; there is no audio."}, {"type": "quiz", "title": "Quick check 1", "question": "Your teacher gives the attention signal. What should you do?", "options": ["Keep working and glance up later.", "Finish the whole activity first.", "Stop typing and face the teacher.", "Ask your partner to listen instead."], "answer": "Stop typing and face the teacher.", "explanation": "Stopping and facing the teacher helps you hear the instruction and shows respect.", "minutes": 1, "notes": "Ask for the reason before revealing feedback. Students can vote with fingers or answer on their device. A useful misconception: ‘I can listen while finishing’ may mean missing an instruction."}, {"type": "cards", "title": "The shared-equipment promise", "cards": [{"title": "Share fairly", "text": "Be patient. Take turns. Use only the time you need."}, {"title": "Ask first", "text": "Do not change equipment settings without permission."}, {"title": "Report a problem", "text": "Tell the teacher about broken or missing equipment."}, {"title": "Reset the space", "text": "Leave equipment in place and the desk clear. Keep food and drinks away."}], "minutes": 2, "notes": "Link each rule to the school's actual expectations. Students should not try to repair plugs, electrical equipment or damaged hardware."}, {"type": "sort", "title": "Ready for the next class?", "text": "Choose ‘Ready’ or ‘Needs a change’ for each workspace choice.", "categories": ["Ready", "Needs a change"], "items": [{"text": "Keyboard and mouse left in their places.", "category": "Ready", "why": "The next user can begin quickly."}, {"text": "A drink beside the keyboard.", "category": "Needs a change", "why": "Spills can damage equipment and can be dangerous near electricity."}, {"text": "A loose cable reported to the teacher.", "category": "Ready", "why": "Reporting lets an adult handle the problem."}, {"text": "A student changes a display setting without asking.", "category": "Needs a change", "why": "Shared equipment should not be adjusted without permission."}, {"text": "Partners swap after the agreed time.", "category": "Ready", "why": "Both get a fair chance to practise."}], "minutes": 3, "notes": "Ask pairs to justify two decisions. Do not interpret ‘ready’ as permission for students to touch loose cables; the good choice is reporting them."}, {"type": "activity", "title": "The 90-second room rescue", "text": "Use a safe visual inspection. Leave plugs and cables alone.", "mode": "Pairs", "steps": ["Look at your work area without moving electrical equipment.", "Identify one thing that is already ready for the next user.", "Tidy only the everyday items your teacher allows you to move.", "Tell the teacher about any damage or missing equipment."], "deliverable": "A two-item readiness check: one positive, one action.", "support": "Check your desk, keyboard position and shared materials.", "stretch": "Explain why reporting is better than trying to repair something yourself.", "workspace": "notebook", "minutes": 4, "notes": "Allow roughly 90 seconds to inspect/tidy and the remaining time to discuss. If classroom movement is unsuitable, students draw an ideal desk and label three choices. Teacher handles any actual equipment problem."}, {"type": "quiz", "title": "Quick check 2", "question": "A mouse button is broken. What is the responsible next step?", "options": ["Tell the teacher what you noticed.", "Pull it apart to find the fault.", "Carry on and tell nobody today.", "Move the mouse to another desk."], "answer": "Tell the teacher what you noticed.", "explanation": "Reporting damage helps the teacher arrange a safe solution and helps the next user.", "minutes": 1, "notes": "All four choices are similar in length. Reinforce reporting, not blaming another student or attempting repairs."}, {"type": "activity", "title": "Two makers. One keyboard.", "text": "Practise fair turns while creating one shared line of text.", "mode": "Pairs", "steps": ["Partner A operates the device; Partner B suggests a rule.", "Type: ‘We help everyone learn by …’ and finish the sentence.", "At the halfway signal, swap who uses the keyboard.", "Add a second rule and read both aloud."], "deliverable": "Two agreed rules, with both partners taking a turn.", "support": "Use the Notebook or write on paper with one shared pencil.", "stretch": "Improve a rule so that it names an action someone can observe.", "workspace": "notebook", "minutes": 6, "notes": "Teacher signals the swap after three minutes. Monitor fair sharing and whether partners let each other think. If devices are scarce, use one paper and pencil per pair. Do not reward speed at the expense of shared participation."}, {"type": "quiz", "title": "Quick check 3", "question": "You have finished your turn, but your partner has not had one. What helps most?", "options": ["Let a friend take your partner's turn.", "Keep control to finish more quickly.", "Start a new game on the computer.", "Give your partner the agreed turn."], "answer": "Give your partner the agreed turn.", "explanation": "A shared device means shared practice time. Finishing early is a chance to let your partner try.", "minutes": 1, "notes": "Follow up: what can the non-typing partner do? Suggest, listen, check or ask a useful question without taking control."}, {"type": "activity", "title": "Write our Web Makers charter", "text": "Create five short rules that a visitor could follow.", "mode": "Teams", "steps": ["Include a rule for listening and a rule for sharing.", "Include a rule for looking after equipment.", "Include a rule for reporting problems.", "Include a rule for leaving the workspace ready.", "Read your rules to another pair and improve one unclear word."], "deliverable": "A five-rule charter with one clear reason beside each rule.", "support": "Use: ‘We … so that …’.", "stretch": "Replace ‘Be good’ with an observable action.", "workspace": "notebook", "minutes": 7, "notes": "Suggested answers: stop typing when signalled; take agreed turns; ask before changing equipment; report damage; leave the desk clear. Reasons should explain benefit. Have learners type in Notebook or a word processor. Export their notes if they need to retain work outside this browser."}, {"type": "quiz", "title": "Quick check 4", "question": "Why should a desk be left tidy after a lesson?", "options": ["It means nobody needs to share.", "It helps the next person begin.", "It makes the screen work faster.", "It replaces the school's rules."], "answer": "It helps the next person begin.", "explanation": "Tidy shared equipment helps the next class find what it needs and start learning.", "minutes": 1, "notes": "This is a reason question: students should connect behaviour to another user's needs."}, {"type": "reflection", "title": "Your first maker checkpoint", "text": "Show what you can do, then leave the space ready.", "prompts": ["Which rule made working with a partner easier? Why?", "What should you do when equipment is damaged?", "What will you do when the teacher gives the attention signal?"], "success": ["I took a fair turn.", "I can explain a respectful action.", "I know how to report an equipment problem."], "minutes": 4, "notes": "Expected: fair turns, patient explanations, listening; report to teacher; stop typing and face the teacher. Reserve the final minute to tidy. Next session: polite messages, reporting upsetting material, and helping without taking over."}, {"type": "brief", "title": "Next mission: help without taking over", "text": "Bring your charter back next time. We will practise being respectful online and being a useful partner.", "bullets": ["Export your Notebook if you used it.", "Leave the equipment ready for the next class."], "minutes": 2, "notes": "Use two minutes to export/save and check desks. If the lesson runs short, this save step must still happen. Teacher can collect paper charters or local files through the school's usual system."}]}</script>

adding:6px 9px;min-height:35px}#studioDialog .ws-import{display:none}@media(max-width:800px){#studioDialog{inset:0;width:100vw;height:100dvh;max-height:100dvh;border-radius:0}#studioDialog .ws-bar{padding:12px;align-items:flex-start;gap:9px}#studioDialog .ws-bar h2{font-size:19px}#studioDialog .ws-actions{gap:5px}#studioDialog .ws-actions button{font-size:12px;padding:6px 8px;min-height:37px}#studioDialog .ws-content{display:block;overflow:auto}#studioDialog .ws-editor{overflow:visible;padding:18px;border-right:0}#studioDialog .ws-preview{height:540px;padding:12px}#studioDialog .ws-footer{padding:8px 12px}#studioDialog .ws-status{font-size:11px}#studioDialog .ws-top-fields{grid-template-columns:1fr 100px}}@media(max-width:440px){#studioDialog .ws-bar{flex-wrap:wrap}#studioDialog .ws-actions{width:100%}#studioDialog .ws-bar p{font-size:12px}#studioDialog .ws-pair{grid-template-columns:1fr}#studioDialog .ws-top-fields{grid-template-columns:1fr}#studioDialog .ws-footer{align-items:flex-start}}</style><div class="ws-shell"><header class="ws-bar"><div><h2 id="wsTitle">Web Studio</h2><p>Build locally. Preview. Save your project.</p></div><div class="ws-actions"><button type="button" data-action="import">Import project</button><button type="button" data-action="project">Export project</button><button type="button" data-action="website" class="ws-primary">Export website ZIP</button><button type="button" data-action="close" aria-label="Close Web Studio">Close ×</button></div></header><div class="ws-content"><div class="ws-editor"><p class="ws-hint">Start blank. Add only what your lesson needs. Use fictional topics and keep personal details private.</p><div class="ws-fields"></div></div><div class="ws-preview"><div class="ws-preview-header"><span class="ws-preview-label">Preview: Home</span><button type="button" data-action="homePreview">Preview Home</button></div><iframe title="Your web page preview" sandbox="allow-scripts"></iframe><p class="ws-hint">Menu links work in this  if(t.id==='wsImageFile'&&t.files[0]){const f=t.files[0];if(f.size>2000000||!/^image\/(png|jpeg|webp|gif)$/.test(f.type)){notify('Choose a PNG, JPEG, WebP or GIF image no larger than 2 MB.');t.value='';return;}try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f);});state.home.upload=safeImage(data);state.home.image=state.home.upload?'upload':'none';persist();renderControls();notify('Image added. Describe it and add any required credit.');}catch(_){notify('The image could not be opened. Choose another permitted file.');}}

</script><script>(()=>{'use strict';
const D=JSON.parse(document.getElementById('lesson-data').textContent), AS=window.LESSON_MEDIA||{};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='webmakers-v1-'+D.id;let storageOK=true;const read=(k,fall)=>{try{return JSON.parse(localStorage.getItem(k))??fall}catch(e){storageOK=false;return fall}};const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageOK=false;return false}};
let state=read(KEY,{answers:{},notes:{},checks:{}});state.answers=state.answers||{};state.notes=state.notes||{};state.checks=state.checks||{};let slideIndex=0,timer=0,timerRunning=false,timerEnd=0,orderState={},notebookIndex=0;
const persist=()=>save(KEY,state);const totalQuiz=D.slides.filter(x=>x.type==='quiz').length;
window.WebMakerDownload=(name,blob)=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
function download(name,text,type='text/plain;charset=utf-8'){window.WebMakerDownload(name,new Blob([text],{type}))}
function shuffle(a,seed){let x=seed+19;return a.map((v,i)=>({v,key:((x=(x*1664525+1013904223)>>>0)/4294967296)})).sort((a,b)=>a.key-b.key).map(x=>x.v)}
function list(a,cl='big-list'){return '<ul class="'+cl+'">'+(a||[]).map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>'}
function b(text,action,cl=''){return '<button class="'+cl+'" data-action="'+action+'">'+text+'</button>'}
const kinds={hero:'Launch',brief:'Learn',cards:'Explore',compare:'Compare',activity:'Make & try',quiz:'Quick check',match:'Match it',order:'Put in order',sort:'Sort it',animation:'Watch & explain',studio:'Build it',reflection:'Reflect',timeline:'Explore'};
function hero(s){return '<div class="hero"><div><div class="eyebrow"><span class="pill">Week '+D.week+' · Session '+D.session+'</span><span>Grade 6 · 40 minutes</span></div><h1>'+E(s.title)+'</h1><p class="lede">'+E(s.text)+'</p><div class="hero-details"><span>Think together</span><span>Make something</span><span>Explain your choices</span></div><div class="task-actions">'+b('Start the lesson →','next','primary')+b('Our goals','goals')+'</div></div><div class="hero-art" aria-hidden="true"><div class="mock-browser"><div class="browser-top"><i></i><i></i><i></i><span>WEB MAKERS</span></div><div class="browser-inside"><div class="browser-nav"><div class="logo-square">✦</div><b>Your ideas. On the web.</b></div><div class="browser-title">Small steps.<br>Something brilliant.</div><div class="browser-line" style="width:92%"></div><div class="browser-line" style="width:73%"></div><div class="browser-picture"><span>✦</span><span>▤</span><span>↗</span></div><div class="browser-line" style="width:82%"></div></div></div><div class="art-badge">THINK • MAKE • IMPROVE</div></div></div>'}
function task(s,studio=false){return (s.text?'<p class="lede">'+E(s.text)+'</p>':'')+'<div class="activity-layout"><ol class="steps">'+(s.steps||[]).map(x=>'<li>'+E(x)+'</li>').join('')+'</ol><aside class="task-box"><h3>Your finished work</h3><p>'+E(s.deliverable)+'</p><div class="rule"></div><p class="hint"><strong>Need a start?</strong><br>'+E(s.support)+'</p><p class="hint"><strong>Ready for more?</strong><br>'+E(s.stretch)+'</p><div class="task-actions">'+b(studio?'Open Web Studio ↗':'Open Notebook ↗',studio?'studio':'notebook','primary')+'</div></aside></div>'}
function quiz(s,i){let a=state.answers[i],done=a?.mastered;return '<div class="quiz-wrap"><p class="quiz-question">'+E(s.question)+'</p><div class="options">'+s.options.map((op,j)=>'<button class="option '+(done&&op===s.answer?'correct':'')+'" data-quiz="'+i+'" data-option="'+j+'" '+(done?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+E(op)+'</span></button>').join('')+'</div><div class="feedback" id="feedback-'+i+'" role="status" aria-live="polite">'+(done?'<strong>✓ Understood.</strong> '+E(s.explanation):'')+'</div></div>'}
function matching(s,i){let choices=shuffle(s.pairs.map(x=>x.right),i+31);return '<p class="lede">'+E(s.text)+'</p><div class="match-items">'+s.pairs.map((p,j)=>'<label class="interaction-row" id="row-'+i+'-'+j+'"><span>'+E(p.left)+'</span><select aria-label="Match '+E(p.left)+'" data-match="'+i+'" data-row="'+j+'"><option value="">Choose a match…</option>'+choices.map(c=>'<option value="'+E(c)+'">'+E(c)+'</option>').join('')+'</select></label>').join('')+'</div><div class="task-actions">'+b('Check matches','check-match:'+i,'primary')+b('Clear choices','reset-match:'+i)+'</div><div class="feedback" id="feedback-'+i+'" role="status" aria-live="polite"></div>'}
function sorting(s,i){return '<p class="lede">'+E(s.text)+'</p>'+s.items.map((x,j)=>'<label class="interaction-row" id="row-'+i+'-'+j+'"><span>'+E(x.text)+'</span><select aria-label="Classify '+E(x.text)+'" data-sort="'+i+'" data-row="'+j+'"><option value="">Choose a group…</option>'+s.categories.map(c=>'<option value="'+E(c)+'">'+E(c)+'</option>').join('')+'</select><small class="why" hidden>'+E(x.why)+'</small></label>').join('')+'<div class="task-actions">'+b('Check groups','check-sort:'+i,'primary')+b('Clear choices','reset-sort:'+i)+'</div><div class="feedback" id="feedback-'+i+'" role="status" aria-live="polite"></div>'}
function orderRows(s,i){const a=orderState[i]??(orderState[i]=shuffle(s.items.map((_,j)=>j),i+54));if(a.every((v,j)=>v===j)&&!orderState['moved'+i]){a.push(a.shift())}return a.map((idx,j)=>'<div class="order-row"><span class="order-num">'+(j+1)+'</span><span class="order-text">'+E(s.items[idx])+'</span><button data-move="'+i+','+j+',-1" aria-label="Move step '+(j+1)+' up" '+(j===0?'disabled':'')+'>↑</button><button data-move="'+i+','+j+',1" aria-label="Move step '+(j+1)+' down" '+(j===a.length-1?'disabled':'')+'>↓</button></div>').join('')}
function ordered(s,i){return '<p class="lede">'+E(s.text)+'</p><div id="order-'+i+'">'+orderRows(s,i)+'</div><div class="task-actions">'+b('Check the sequence','check-order:'+i,'primary')+'</div><div class="feedback" id="feedback-'+i+'" role="status" aria-live="polite"></div>'}
function animation(s,i){let m=AS[s.animation];return '<div class="animation-layout"><div><div class="animation-media">'+(m?'<video id="video-'+i+'" controls playsinline preload="metadata" poster="'+m.poster+'" aria-label="'+E(s.title)+'"><source src="'+m.video+'" type="video/mp4">Your browser cannot play this clip. Use the labelled image and discussion prompts.</video>':'<p>Animation not available.</p>')+'</div><div class="task-actions">'+b('Play / replay animation','play:'+i,'primary')+'</div><div class="video-caption">Original Manim animation · silent · pause or replay at any point</div></div><div><p>'+E(s.text)+'</p>'+list(s.prompts,'watch-questions')+'</div></div>'}
function reflection(s,i){return '<p class="lede">'+E(s.text)+'</p><div class="reflection-grid"><div>'+list(s.prompts,'steps')+'<div class="task-actions">'+b('Write your reflection','notebook','primary')+'</div></div><div class="task-box"><h3>Can you show it?</h3><div class="success-list">'+s.success.map((x,j)=>'<label><input type="checkbox" data-check="'+i+'-'+j+'" '+(state.checks[i+'-'+j]?'checked':'')+'><span>'+E(x)+'</span></label>').join('')+'</div><div class="rule"></div><p class="hint">Use an example from your work as evidence.</p></div></div>'}
function slide(s,i){let body='';switch(s.type){case'hero':body=hero(s);break;case'brief':body='<p class="lede">'+E(s.text)+'</p>'+list(s.bullets);break;case'cards':body=(s.text?'<p class="lede">'+E(s.text)+'</p>':'')+'<div class="card-grid count-'+s.cards.length+'">'+s.cards.map((x,j)=>'<article class="concept-card"><span class="card-number">0'+(j+1)+'</span><h3>'+E(x.title)+'</h3><p>'+E(x.text)+'</p></article>').join('')+'</div>';break;case'compare':body='<div class="compare-grid">'+[s.left,s.right].map(x=>'<article class="compare-card"><h3>'+E(x.title)+'</h3><p>'+E(x.text)+'</p>'+(x.bullets?list(x.bullets,''): '')+'</article>').join('')+'</div>'+(s.prompt?'<p class="prompt">'+E(s.prompt)+'</p>':'');break;case'activity':body=task(s);break;case'studio':body=task(s,true);break;case'quiz':body=quiz(s,i);break;case'match':body=matching(s,i);break;case'sort':body=sorting(s,i);break;case'order':body=ordered(s,i);break;case'animation':body=animation(s,i);break;case'reflection':body=reflection(s,i);break;case'timeline':body='<div class="timeline-grid">'+s.items.map(x=>'<div><strong>'+E(x.year)+'</strong><p>'+E(x.text)+'</p></div>').join('')+'</div>';break;default:body='<p>'+E(s.text)+'</p>'}
const head=s.type==='hero'?'':'<div class="eyebrow"><span class="pill">'+E(kinds[s.type]||'Explore')+'</span><span>'+(s.mode?E(s.mode)+' · ':'')+s.minutes+' min</span></div><h2>'+E(s.title)+'</h2>';
return '<section data-slide="'+i+'" aria-label="Slide '+(i+1)+': '+E(s.title)+'"><div class="slide-shell">'+head+body+'<div class="slide-footer"><span>WEB MAKERS · W'+D.week+' / S'+D.session+'</span><span>'+E(D.source)+'</span></div></div></section>'}
$('#slides').innerHTML=D.slides.map(slide).join('');$('#week-session').textContent='WEEK '+D.week+' · SESSION '+D.session;
document.title='Web Makers · Week '+D.week+' Session '+D.session+' · '+D.title;
if(read('webmakers-theme','light')==='dark')document.body.classList.add('dark');
function modal(id){document.body.classList.add('modal-open');const el=$('#'+id);if(!el.open)el.showModal();$('#toolsMenu').hidden=true;return el}
function closeDialogs(){$$('dialog[open]').forEach(x=>x.close());document.body.classList.remove('modal-open')}
$$('dialog').forEach(d=>{d.addEventListener('close',()=>{if(!$('dialog[open]'))document.body.classList.remove('modal-open')});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})});
function map(goals=false){let weekTitles=['Respectful computer users','Parts and wireframes','Create a page with text','Choose and add images','Pages, menus and links','Review, improve and share'];let durations=D.slides.reduce((a,s)=>a+s.minutes,0);$('#mapBody').innerHTML='<div class="note-banner"><strong>'+E(D.title)+'</strong><p>'+E(D.subtitle)+'</p><div class="quiz-stats"><span><b>'+durations+'</b> minutes</span><span><b>'+D.slides.length+'</b> slides</span><span><b>'+totalQuiz+'</b> quick checks</span></div></div><h3>By the end, you can…</h3><ul>'+D.objectives.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><h3>You will make</h3><p>'+E(D.artifact)+'</p><h3>Your words for today</h3><div class="vocab-grid">'+D.vocabulary.map(x=>'<div><strong>'+E(x.term)+'</strong>'+E(x.meaning)+'</div>').join('')+'</div><h3>Jump to a slide</h3><div class="slide-jumps">'+D.slides.map((x,i)=>'<button data-goto="'+i+'">'+(i+1)+'. '+E(x.title)+'<span>'+x.minutes+'m</span></button>').join('')+'</div><h3>Our six-week journey</h3><div class="lesson-grid">'+weekTitles.map((x,i)=>'<div class="lesson-card '+(i+1===D.week?'current':'')+'"><span>WEEK '+(i+1)+' · TWO × 40 MINUTES</span><strong>'+E(x)+'</strong><span>'+(i+1===D.week?'You are here':'Open that week’s downloaded lesson files')+'</span></div>').join('')+'</div><p class="lesson-credit">Original classroom activities based on the supplied Oxford Grade 6 Unit 2. Source: '+E(D.source)+'.</p>';modal('mapDialog')}
function notes(){let s=D.slides[slideIndex];$('#notesBody').innerHTML='<div class="note-banner"><strong>Slide '+(slideIndex+1)+': '+E(s.title)+' · '+s.minutes+' min</strong><p>'+E(s.notes||'Ask students to explain their choices and check the stated success criteria.')+'</p></div><h3>Lesson preparation</h3><ul>'+D.teacherPrep.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><h3>Materials</h3><ul>'+D.materials.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><h3>Pacing and teacher notes</h3>'+D.slides.map((x,i)=>'<details><summary><strong>'+String(i+1).padStart(2,'0')+' · '+E(x.title)+'</strong> ('+x.minutes+' min)</summary><p>'+E(x.notes||'')+'</p></details>').join('')+'<h3>Use the presentation</h3><p>Arrow keys or the Next/Back buttons move between slides. On a phone, scroll a slide to read all of it. Map opens the contents. Each activity has a timer you can start, pause and reset. Fullscreen and light/dark mode are in Tools. Videos are silent and have playback controls.</p><p>Notebook notes and quiz progress stay in this browser when local storage is available. Export notes and Studio project files for reliable saving and for moving between lesson files. Do not enter personal or identifying information.</p><p>Open the individual HTML file in a full browser after downloading. Some file-preview screens block scripts. Internet is not required for the lessons, embedded animations or practice editor.</p><p><strong>Source:</strong> '+E(D.source)+'. The old Wix screenshots teach general visual-editor steps. A teacher-approved current editor may use different buttons. This kit supplies an offline practice editor; it is not Wix.</p>'+(D.week===1?'<p><strong>Source correction:</strong> Printed p.21 gives conflicting web-invention years. CERN dates the proposal to 1989, the first website to late 1990 and the wider announcement to 1991. <a href="https://home.cern/science/computing/the-birth-of-the-web/short-history-web/" target="_blank" rel="noopener noreferrer">CERN history of the web</a>. No date memorisation or changing website-count claim is required.</p>':'');modal('notesDialog')}
function notePrompt(s){if(s.type==='reflection')return s.prompts.join('\n');if(s.type==='activity'||s.type==='studio')return s.steps.map((x,i)=>(i+1)+'. '+x).join('\n')+'\nFinished work: '+s.deliverable;if(s.type==='quiz')return s.question;if(s.type==='animation')return s.prompts.join('\n');return s.text||s.title}
function fillNotebook(i){notebookIndex=i;$('#notebookSelect').value=String(i);$('#notebookPrompt').textContent=notePrompt(D.slides[i]);$('#notebookText').value=state.notes[i]||'';$('#saveStatus').textContent=storageOK?'Saved on this browser as you type. Export to keep a portable copy.':'This browser blocks local saving. Keep this page open and export your notes.'}
function notebook(){let sel=$('#notebookSelect');if(!sel.options.length)sel.innerHTML=D.slides.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+E(s.title)+'</option>').join('');fillNotebook(slideIndex);modal('notebookDialog')}
$('#notebookSelect').addEventListener('change',e=>fillNotebook(Number(e.target.value)));$('#notebookText').addEventListener('input',e=>{state.notes[notebookIndex]=e.target.value;persist();$('#saveStatus').textContent=storageOK?'Saved on this browser. Export to keep a portable copy.':'Local saving is blocked. Use Export notes before closing.'});
function exportNotes(){let text='WEB MAKERS · WEEK '+D.week+' SESSION '+D.session+'\n'+D.title+'\n\n';D.slides.forEach((s,i)=>{if(state.notes[i])text+=(i+1)+'. '+s.title+'\n'+notePrompt(s)+'\n\nMy response:\n'+state.notes[i]+'\n\n';});if(!Object.values(state.notes).some(x=>x.trim()))text+='No written responses yet.\n';download('Web_Makers_'+D.id+'_Notes.txt',text)}
function updateScore(){let a=Object.values(state.answers),first=a.filter(x=>x.firstCorrect).length,mastered=a.filter(x=>x.mastered).length;$('#score').textContent='First try '+first+'/'+totalQuiz+' · Practised '+mastered+'/'+totalQuiz}
function updateTimer(){if(timerRunning){timer=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(timer===0)timerRunning=false}$('#timer').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0');$('#timer').classList.toggle('done',timer===0);$('#timerToggle').textContent=timerRunning?'Pause':'Start';$('#timerToggle').disabled=D.slides[slideIndex].minutes===0;$('#timer').setAttribute('aria-label','Activity timer '+Math.floor(timer/60)+' minutes '+timer%60+' seconds')}
function changed(event){slideIndex=event?.indexh??Reveal.getIndices().h;$$('video').forEach(v=>{v.pause()});timerRunning=false;timer=D.slides[slideIndex].minutes*60;updateTimer();$('#counter').textContent=(slideIndex+1)+' / '+D.slides.length;$('#navLabel').textContent=kinds[D.slides[slideIndex].type]||'Explore';$('#barFill').style.width=((slideIndex+1)/D.slides.length*100)+'%';$('#prev').disabled=slideIndex===0;$('#next').disabled=slideIndex===D.slides.length-1;$('#next').textContent=slideIndex===D.slides.length-1?'Complete ✓':'Next →';const sec=$('section.present');if(sec)sec.scrollTop=0;updateScore()}
function checkRows(i,type){let s=D.slides[i],rows=type==='match'?s.pairs:s.items,els=$$('[data-'+type+'="'+i+'"]'),allFilled=els.every(el=>el.value);if(!allFilled){$('#feedback-'+i).textContent='Choose an answer for every row, then check.';return}let count=0;els.forEach((el,j)=>{let correct=el.value===(type==='match'?rows[j].right:rows[j].category);count+=correct?1:0;let row=$('#row-'+i+'-'+j);row.classList.toggle('ok',correct);row.classList.toggle('bad',!correct);let why=row.querySelector('.why');if(why)why.hidden=false});$('#feedback-'+i).textContent=count===rows.length?'✓ All '+count+' choices make sense. Explain one to your partner.':count+' of '+rows.length+' are correct. Reconsider the outlined rows, then check again.'}
function resetRows(i,type){$$('[data-'+type+'="'+i+'"]').forEach(el=>{el.value='';el.closest('.interaction-row').classList.remove('ok','bad');let why=el.closest('.interaction-row').querySelector('.why');if(why)why.hidden=true});$('#feedback-'+i).textContent=''}
function handleAction(a){if(a==='next'){Reveal.next();return}if(a==='prev'){Reveal.prev();return}if(a==='map'||a==='goals'){map(a==='goals');return}if(a==='notes'){notes();return}if(a==='notebook'){notebook();return}if(a==='close'){closeDialogs();return}if(a==='tools'){$('#toolsMenu').hidden=!$('#toolsMenu').hidden;return}if(a==='theme'){document.body.classList.toggle('dark');save('webmakers-theme',document.body.classList.contains('dark')?'dark':'light');$('#toolsMenu').hidden=true;return}if(a==='fullscreen'){$('#toolsMenu').hidden=true;if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}else document.exitFullscreen?.();return}if(a==='studio'){if(window.WebStudio){window.WebStudio.open()}else{notebook();$('#notebookPrompt').textContent='Web Studio starts with the page-building lessons in Week 3. Use your Notebook for this activity.'}return}if(a==='export-notes'){exportNotes();return}if(a==='timer'){if(timerRunning){timerRunning=false;}else{if(timer<=0)timer=D.slides[slideIndex].minutes*60;timerEnd=Date.now()+timer*1000;timerRunning=true}updateTimer();return}if(a==='reset-timer'){timerRunning=false;timer=D.slides[slideIndex].minutes*60;updateTimer();return}if(a.startsWith('check-match:')){checkRows(Number(a.split(':')[1]),'match');return}if(a.startsWith('check-sort:')){checkRows(Number(a.split(':')[1]),'sort');return}if(a.startsWith('reset-match:')){resetRows(Number(a.split(':')[1]),'match');return}if(a.startsWith('reset-sort:')){resetRows(Number(a.split(':')[1]),'sort');return}if(a.startsWith('check-order:')){let i=Number(a.split(':')[1]),ok=orderState[i].every((v,j)=>v===j);$('#feedback-'+i).textContent=ok?'✓ The order works. '+(D.slides[i].explanation||'Explain why one step needs to happen before the next.'):'Not quite yet. Consider what must happen first, then adjust the order.';return}if(a.startsWith('play:')){let v=$('#video-'+a.split(':')[1]);if(v){v.currentTime=0;v.play().catch(()=>{})}return}if(a==='reset-progress'){modal('resetDialog');return}if(a==='confirm-reset'){state.answers={};persist();closeDialogs();location.reload();return}}
document.addEventListener('click',e=>{let target=e.target.closest('[data-action]');if(target){handleAction(target.dataset.action);return}let go=e.target.closest('[data-goto]');if(go){closeDialogs();Reveal.slide(Number(go.dataset.goto));return}let q=e.target.closest('[data-quiz]');if(q){let i=Number(q.dataset.quiz),j=Number(q.dataset.option),s=D.slides[i],correct=s.options[j]===s.answer;if(state.answers[i]?.mastered)return;if(!state.answers[i])state.answers[i]={firstCorrect:correct,mastered:false,attempts:0};state.answers[i].attempts++;state.answers[i].mastered=correct;persist();q.classList.add(correct?'correct':'incorrect');$('#feedback-'+i).innerHTML='<strong>'+(correct?'✓ Good thinking.':'Try again.')+'</strong> '+E(s.explanation);if(correct)$$('[data-quiz="'+i+'"]').forEach(x=>x.disabled=true);updateScore();return}let move=e.target.closest('[data-move]');if(move){let [i,j,delta]=move.dataset.move.split(',').map(Number),arr=orderState[i];if(j+delta<0||j+delta>=arr.length)return;[arr[j],arr[j+delta]]=[arr[j+delta],arr[j]];orderState['moved'+i]=true;$('#order-'+i).innerHTML=orderRows(D.slides[i],i);$('#feedback-'+i).textContent='';return}if(!e.target.closest('.tools-wrap'))$('#toolsMenu').hidden=true});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){state.checks[e.target.dataset.check]=e.target.checked;persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#toolsMenu').hidden=true});
Reveal.initialize({hash:true,controls:false,progress:false,center:false,disableLayout:true,width:'100%',height:'100%',margin:0,transition:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'none':'fade',transitionSpeed:'fast',touch:false,overview:false,help:false,respondToHashChanges:true,keyboardCondition:()=>!document.querySelector('dialog[open]'),embedded:false,autoPlayMedia:false,hideInactiveCursor:false}).then(()=>{changed();document.documentElement.dataset.ready='true'});
Reveal.on('slidechanged',changed);setInterval(updateTimer,300);window.WebMakers={data:D,getState:()=>state,go:i=>Reveal.slide(i),openNotes:notes};
})();
</script>
