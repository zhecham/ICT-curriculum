 const centralSize=central.reduce((n,b)=>n+b.length,0),end=hdr(22),ev=end.view;ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...parts,...central,end.bytes],{type:'application/zip'});
