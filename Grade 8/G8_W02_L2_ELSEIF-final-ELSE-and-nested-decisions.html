work":"Write an ELSEIF algorithm that converts a mark into a grade band."},"content":{"s":{"h":"Starter: which grade?","mcq":["mark = 85. Rules checked in this order: >= 50 → C, >= 70 → B, >= 80 → A. What is output?",["A","B","C","nothing"],2,"The first true condition wins – check the largest boundary first!"]},"t":[{"h":"ELSEIF and a final ELSE","side":1,"code":"IF mark >= 80 THEN\n    OUTPUT \"A\"\nELSEIF mark >= 70 THEN\n    OUTPUT \"B\"\nELSEIF mark >= 50 THEN\n    OUTPUT \"C\"\nELSE\n    OUTPUT \"Not yet\"\nENDIF","lang":"plaintext","b":["Conditions are checked top to bottom.","The first true one runs; the rest are skipped.","The final ELSE catches everything else (fallback)."]},{"h":"Nested decisions","code":"IF member = TRUE THEN\n    IF age \u003c 16 THEN\n        OUTPUT \"Junior member\"\n    ELSE\n        OUTPUT \"Adult member\"\n    ENDIF\nELSE\n    OUTPUT \"Please join\"\nENDIF","lang":"plaintext"}],"q":[["Why include a final ELSE?",["To make code longer","To handle every remaining case","It is required by Python","To repeat a condition"],1,"It is the fallback."],["mark = 72 in the ELSEIF example. Output?",["A","B","C","Not yet"],1,"72 fails >= 80, passes >= 70."],["In a nested decision, when is the inner IF checked?",["Always","Only if the outer route reaches it","Before the outer IF","Never"],1,"It sits inside one branch."]],"x":["Test data for the grade algorithm: give one value for each output.","e.g. 90 → A, 75 → B, 55 → C, 30 → Not yet"]}};</script><script src="../assets/deck.js"></script></body></html>
